name: Imagem da API

# Publica a imagem do backend no GitHub Container Registry (ghcr.io).
# Imagens publicas no GHCR nao custam nada e o Azure Container Apps consegue
# baixar sem credencial de registry.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/api-image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/meu-treino-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Configura o Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autentica no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Monta as tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          # amd64 para Container Apps/App Service; arm64 para VM Ampere/Graviton
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        run: |
          echo "### Imagem publicada" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Torne o pacote publico em Settings > Packages para o Azure" >> $GITHUB_STEP_SUMMARY
          echo "baixar sem credencial." >> $GITHUB_STEP_SUMMARY
