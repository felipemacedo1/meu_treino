server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
  compression:
    enabled: true

spring:
  application:
    name: meu-treino-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/meu_treino}
    username: ${DB_USER:meutreino}
    password: ${DB_PASSWORD:meutreino}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:troque-esta-chave-em-producao-meu-treino-2026-super-secreta-1234567890}
    expiration-days: ${JWT_EXPIRATION_DAYS:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  wger:
    base-url: ${WGER_BASE_URL:https://wger.de/api/v2}
    language: ${WGER_LANGUAGE:2}
    page-size: ${WGER_PAGE_SIZE:100}
    max-exercises: ${WGER_MAX_EXERCISES:2000}
    sync-on-startup: ${WGER_SYNC_ON_STARTUP:true}
    timeout-seconds: ${WGER_TIMEOUT_SECONDS:60}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha

logging:
  level:
    root: INFO
    com.meutreino: DEBUG
