server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker. Usar variável no proxy_pass faz o nginx resolver o
    # host a cada requisição, então o container do web sobe mesmo que a API
    # ainda não esteja no ar.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream "api:8080";

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 20m;

    # a API é servida no mesmo host: evita CORS e permite usar /api relativo
    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /swagger-ui/ {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }

    location = /swagger-ui.html {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|wasm|json)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA: qualquer rota cai no index.html (URLs limpas do go_router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
